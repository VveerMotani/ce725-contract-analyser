# Keeps the free Render server from sleeping (it sleeps after 15 idle minutes and loses
# uploaded results and the day's reading count). Pings the site about every 5 minutes.
name: Keep the live site awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Ping now and again in 5 minutes
        run: |
          for i in 1 2; do
            curl -fsS --max-time 120 https://ce725-contract-analyser.onrender.com/api/limits || echo "ping failed"
            echo
            if [ "$i" = 1 ]; then sleep 300; fi
          done
